name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: test + bundle sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit and plugin-boundary E2E tests
        run: npm run check
      - name: Generated client bundle is in sync with src
        run: node scripts/build-client.mjs --check
